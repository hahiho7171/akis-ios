# Akış — iOS bulut build (Codemagic, Mac gerekmeden). Capacitor + SPM (Podfile YOK).
# ASC API anahtarı = hesap-geneli "misyon_asc_key" integration (Codemagic'te zaten kurulu).
# Bundle com.asimgokcek.akis · App Store App ID 6791552371 · Team SGMQ8NVKU3. Ücretsiz, IAP yok.
workflows:
  ios-testflight:
    name: Akış iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    integrations:
      app_store_connect: misyon_asc_key
    environment:
      vars:
        BUNDLE_ID: "com.asimgokcek.akis"
        APP_STORE_APPLE_ID: "6791552371"
      node: 22
      xcode: latest
    scripts:
      - name: Bağımlılıkları kur
        script: |
          npm ci || npm install
      - name: Capacitor iOS ekle/senkronla (+ikon)
        script: |
          if [ ! -d "ios" ]; then npx cap add ios; fi
          npx @capacitor/assets generate --ios || echo "assets üretilemedi, varsayılan ikonla devam"
          npx cap sync ios
      - name: iOS build numarasını benzersiz yap
        script: |
          cd ios/App
          LAST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          case "$LAST" in ''|*[!0-9]*) LAST=0;; esac
          NEXT=$((LAST + 1))
          if [ -n "$BUILD_NUMBER" ] && [ "$BUILD_NUMBER" -gt "$NEXT" ] 2>/dev/null; then NEXT=$BUILD_NUMBER; fi
          agvtool new-version -all $NEXT
          agvtool new-marketing-version 1.9.9
          echo "iOS CFBundleVersion = $NEXT · marketing 1.9.9"
      - name: Info.plist — URL şeması + şifreleme muafiyeti
        script: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string com.asimgokcek.akis" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
          # AdMob App ID (iOS) — yoksa uygulama açılışta çöker
          /usr/libexec/PlistBuddy -c "Set :GADApplicationIdentifier ca-app-pub-3326866070505611~1687859449" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :GADApplicationIdentifier string ca-app-pub-3326866070505611~1687859449" "$PLIST"
      # 🚨 ATT izin metni buradan KALDIRILDI (2026-08-12 Apple reddi, Guideline 4.0.0).
      # Metin Türkçe gömülüydü; inceleyicinin İngilizce iPad'inde uygulama İngilizce,
      # izin kutusu Türkçe çıktı → ret. Artık ayrı betik yönetiyor (İngilizce + 20 dil).
      - name: İzin (ATT) metinleri — uygulamanın diliyle eşitle
        script: |
          bash scripts/ios_izin_metinleri.sh
      - name: iOS imzalama dosyalarını oluştur/al (sertifika + profil)
        script: |
          keychain initialize
          # 🚨 Apple dağıtım sertifikası hesap-geneli ve LİMİTLİ (bireysel hesapta 2).
          # 2026-07-31: bu adım iki kez üst üste patladı. SEBEP: aşağıdaki temizlik
          # `certificates list --certificate-type DISTRIBUTION` ile listeliyordu; o bayrak
          # boş/hatalı dönünce hiçbir sertifika SİLİNMİYOR, ardından `--create` limite
          # takılıp (409) adım düşüyordu. Sipling'in çalışan yaml'ındaki yöntem alındı:
          # TÜM sertifikaları listele → jq ile DISTRIBUTION olanları süz → en yeni 1 hariç sil.
          # Loglu, çünkü Codemagic API'si adım günlüğünü dışarı vermiyor.
          set +e
          app-store-connect certificates list --json > /tmp/certs.json 2>/tmp/certs_err.txt || cat /tmp/certs_err.txt
          echo "=== Mevcut sertifikalar ==="
          jq -r '.[] | "\(.id) \(.attributes.certificateType) exp=\(.attributes.expirationDate)"' /tmp/certs.json 2>/dev/null || echo "(jq parse edemedi)"
          for cid in $(jq -r '[.[]|select(.attributes.certificateType|test("DISTRIBUTION"))]|sort_by(.attributes.expirationDate)|reverse|.[1:]|.[].id' /tmp/certs.json 2>/dev/null); do
            echo "siliniyor: $cid"
            app-store-connect certificates delete "$cid" && echo "silindi $cid" || echo "SILINEMEDI $cid"
          done
          # Akış profillerini sil (izole — diğer uygulamalara dokunma)
          for pid in $(app-store-connect profiles list --json 2>/dev/null | jq -r '.[]|select(.attributes.name|test("Akis|akis|com\\.asimgokcek\\.akis"))|.id' 2>/dev/null); do
            app-store-connect profiles delete "$pid" && echo "profil silindi $pid"
          done
          set -e
          echo "Imza temizligi bitti."
          openssl genrsa -out /tmp/cert_key.pem 2048
          app-store-connect fetch-signing-files "com.asimgokcek.akis" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/cert_key.pem \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: IPA derle (SPM → xcodeproj, workspace YOK)
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
